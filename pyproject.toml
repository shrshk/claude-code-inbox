[project]
name = "claude-code-inbox"
version = "0.1.0"
description = "Turn finished Claude Code sessions into a swipeable inbox of action items."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shirish Veerabattini", email = "shirish101k@gmail.com" }]
requires-python = ">=3.11"
keywords = ["claude-code", "action-items", "pwa", "productivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/shrshk/claude-code-inbox"
Issues = "https://github.com/shrshk/claude-code-inbox/issues"

[project.scripts]
ccinbox = "ccinbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccinbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
